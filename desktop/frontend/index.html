<!doctype html>
<html lang="zh-CN" data-accent="green">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>Routilet</title><link rel="stylesheet" href="/ui/routilet.css"><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><div class="brand"><img src="/icons/routilet.svg" alt="" width="26" height="26"><h1>Routilet</h1></div><button id="refresh" class="icon-button ui-button ui-icon-button" title="检查更新" aria-label="检查更新"><svg class="ui-icon" data-size="20" aria-hidden="true"><use href="/ui/icons/sprite.svg#refresh-cw"/></svg></button></header>
<div class="catalog"><section id="apps" aria-label="应用"></section>
<section id="components" aria-labelledby="components-title" hidden><h2 id="components-title">功能组件</h2><div id="component-list"></div></section></div>
<section id="task" class="task" hidden aria-label="当前操作"><div class="task-head"><span id="task-stage" role="status"></span><button id="task-cancel" class="small-button ui-button">取消</button></div><span class="task-spinner" aria-hidden="true"></span><progress id="task-bar" hidden aria-label="当前下载文件进度"></progress><span id="task-detail" class="muted"></span></section>
<div id="notice" role="status" hidden></div>
<footer><div class="footer-meta"><span id="version"></span><button id="check-status" class="plain" disabled>尚未检查更新</button></div><div class="footer-actions"><button id="self-action" class="update ui-button" data-kind="secondary" hidden></button><button id="settings" class="icon-button ui-button ui-icon-button" title="设置" aria-label="设置"><svg class="ui-icon" data-size="20" aria-hidden="true"><use href="/ui/icons/sprite.svg#settings"/></svg></button></div></footer>
</main>
<div id="app-menu" class="menu ui-menu" role="menu" hidden></div>
<dialog class="ui-dialog" id="message" aria-labelledby="message-title"><h2 id="message-title"></h2><p id="message-text"></p><details id="error-detail" hidden><summary>技术详情</summary><pre id="error-raw"></pre></details><div class="actions"><button id="cancel" class="small-button ui-button">取消</button><button id="confirm" class="small-button primary ui-button" data-kind="primary">关闭</button></div></dialog>
<dialog class="ui-dialog" id="settings-dialog" aria-labelledby="settings-title"><div class="settings-head"><h2 id="settings-title">设置</h2><button id="settings-close" class="icon-button ui-button ui-icon-button" aria-label="关闭设置" title="关闭设置"><svg class="ui-icon" aria-hidden="true"><use href="/ui/icons/sprite.svg#x"/></svg></button></div><label for="release-channel">更新通道</label><select class="ui-select" id="release-channel"><option value="" disabled>读取中</option><option value="stable">正式版</option><option value="test">测试版</option></select><p id="channel-note" role="status" class="muted"></p><label for="download-source">下载源</label><select class="ui-select" id="download-source"><option value="" disabled>读取中</option><option value="auto">自动选择（推荐）</option><option value="official">npm 官方源</option></select><p id="download-note" role="status" class="muted"></p><div class="settings-actions"><button id="settings-data">打开数据目录 <span>›</span></button><button id="clean">清理旧版本 <span>›</span></button></div><div id="settings-version" class="muted"></div></dialog>
<script type="module" src="/app.js"></script></body></html>
