name: Build and publish Routilet
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/publish-npm.yml', 'desktop/**']
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'VERSION', '.github/workflows/publish-npm.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routilet-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      existing: ${{ steps.release.outputs.existing }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          v=$(cat VERSION)
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          preview='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc|dev)\.(0|[1-9][0-9]*)$'
          if [[ "$v" =~ $stable ]]; then tag=latest; elif [[ "$v" =~ $preview ]]; then tag=next; else exit 1; fi
          printf 'version=%s\ntag=%s\n' "$v" "$tag" >> "$GITHUB_OUTPUT"
      - id: release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then echo existing=false >> "$GITHUB_OUTPUT"; exit 0; fi
          code="$(curl --silent --show-error --output release-info.json --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"
          case "$code" in
            200) jq -e '.draft == false' release-info.json >/dev/null; echo existing=true >> "$GITHUB_OUTPUT" ;;
            404) echo existing=false >> "$GITHUB_OUTPUT" ;;
            *) echo "Release lookup failed: HTTP $code"; exit 1 ;;
          esac
  frontend-interaction:
    needs: plan
    if: needs.plan.outputs.existing == 'false'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test state and browser interactions (test-only Chromium)
        run: |
          set -euo pipefail
          node --test tests/interaction.test.mjs
          npm install --prefix out/ui-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node out/ui-tools/node_modules/playwright/cli.js install --with-deps chromium
          node --test tests/browser.test.mjs
  build:
    needs: plan
    if: needs.plan.outputs.existing == 'false'
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
            archive: pnpm-win32-x64.zip
            digest: 0a9c1bc147202089b12d91f43349f6f9ae26df191ee704dee313ba3f9a0a8ffe
          - runner: macos-15
            target: darwin-arm64
            archive: pnpm-darwin-arm64.tar.gz
            digest: af43c44f22ef89191d83163c3ef9f5ee021a7368f401c95d92731be7d6b21cc5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies and test
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          node --test tests/interaction.test.mjs
          node --check frontend/app.js
          node --check frontend/dialogs.js
          node --check frontend/menu.js
      - name: Generate native icons from vector source
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          npm install --prefix out/icon-tools --no-save --ignore-scripts --no-audit --no-fund @resvg/resvg-js@2.6.2
          node scripts/generate-icons.cjs
          if [[ "$TARGET" == win32-x64 ]]; then
            go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico out/icons/Routilet.ico -o routilet_windows_amd64.syso
            test -s routilet_windows_amd64.syso
          else
            iconutil -c icns out/icons/Routilet.iconset -o out/icons/Routilet.icns
            test -s out/icons/Routilet.icns
          fi
      - name: Build desktop with fixed pnpm
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          SHA256: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p out/extracted out/package
          curl --fail --location --retry 3 "https://github.com/pnpm/pnpm/releases/download/v12.22.0/$ARCHIVE" -o "out/$ARCHIVE"
          if [[ "$TARGET" == win32-x64 ]]; then
            printf '%s  %s\n' "$SHA256" "out/$ARCHIVE" | sha256sum -c -
            unzip -q "out/$ARCHIVE" -d out/extracted
            bin="$(find out/extracted -type f -iname 'pnpm*.exe' | head -n1)"
            test -n "$bin"
            mkdir -p out/package/Routilet/runtime/licenses
            cp "$bin" out/package/Routilet/runtime/pnpm.exe
            CGO_ENABLED=0 go build -mod=readonly -tags production -trimpath -ldflags="-s -w -H windowsgui -X main.buildVersion=$VERSION" -o out/package/Routilet/Routilet.exe .
            cp scripts/user-guide.txt out/package/Routilet/使用说明.txt
            licenses=out/package/Routilet/runtime/licenses
          else
            test "$(uname -m)" = arm64
            printf '%s  %s\n' "$SHA256" "out/$ARCHIVE" | shasum -a 256 -c -
            tar -xzf "out/$ARCHIVE" -C out/extracted
            bin="$(find out/extracted -type f \( -name pnpm -o -name pnpm-darwin-arm64 \) | head -n1)"
            test -n "$bin"
            app=out/package/Routilet.app
            mkdir -p "$app/Contents/MacOS"
            cp "$bin" "$app/Contents/MacOS/pnpm"
            chmod +x "$app/Contents/MacOS/pnpm"
            cp Info.plist "$app/Contents/Info.plist"
            mkdir -p "$app/Contents/Resources"
            cp out/icons/Routilet.icns "$app/Contents/Resources/"
            CGO_ENABLED=1 MACOSX_DEPLOYMENT_TARGET=12.0 go build -mod=readonly -tags production -trimpath -ldflags="-s -w -X main.buildVersion=$VERSION" -o "$app/Contents/MacOS/Routilet" .
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION%%-*}" "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION%%-*}" "$app/Contents/Info.plist"
            licenses="$app/Contents/Resources/licenses"
            mkdir -p "$licenses"
          fi
          if [[ "$TARGET" == win32-x64 ]]; then export CGO_ENABLED=0; else export CGO_ENABLED=1; fi
          node scripts/native-notices.mjs "$licenses/THIRD_PARTY_NOTICES.txt"
          cp ../LICENSE "$licenses/Routilet-LICENSE"
          while IFS= read -r -d '' notice; do
            cp "$notice" "$licenses/pnpm-$(basename "$notice")"
          done < <(find out/extracted -type f \( -iname '*license*' -o -iname '*notice*' \) -print0)
          if ! compgen -G "$licenses/pnpm-*LICENSE*" >/dev/null && ! compgen -G "$licenses/pnpm-*license*" >/dev/null; then
            curl --fail --location --retry 3 https://raw.githubusercontent.com/pnpm/pnpm/v12.22.0/LICENSE -o "$licenses/pnpm-LICENSE"
          fi
          if [[ "$TARGET" == win32-x64 ]]; then
            python scripts/archive-windows.py out/package/Routilet out/routilet-native-win32-x64.zip
          else
            codesign --force --sign - "$app"
            codesign --verify --strict "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" out/routilet-native-darwin-arm64.zip
          fi
          ls -lh out/routilet-native-*
      - name: Test extracted final distribution
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          unpack="out/发行 验证/deep-folder/another folder/用户文件"
          mkdir -p "$unpack"
          if [[ "$TARGET" == win32-x64 ]]; then
            python -m zipfile -e out/routilet-native-win32-x64.zip "$unpack"
            test -f "$unpack/Routilet/使用说明.txt"
            test -f "$unpack/Routilet/runtime/pnpm.exe"
            test ! -e "$unpack/Routilet/pnpm.exe"
            python scripts/check-distribution.py "$unpack/Routilet/Routilet.exe" "$VERSION"
          else
            ditto -x -k out/routilet-native-darwin-arm64.zip "$unpack"
            codesign --verify --strict "$unpack/Routilet.app"
            test -x "$unpack/Routilet.app/Contents/MacOS/pnpm"
            python3 scripts/check-distribution.py "$unpack/Routilet.app/Contents/MacOS/Routilet" "$VERSION"
          fi
      - name: Test native manager self-update from local npm tarball
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == win32-x64 ]]; then
            CGO_ENABLED=0 go build -mod=readonly -tags production -trimpath -ldflags="-H windowsgui -X main.buildVersion=9999.0.0 -X main.fixtureMode=ready" -o out/candidate.exe .
            python scripts/package-manager.py --version 9999.0.0 --windows out/candidate.exe --out out/manager-fixture.tgz
            python scripts/check-distribution.py "out/发行 验证/deep-folder/another folder/用户文件/Routilet/Routilet.exe" "$VERSION" out/manager-fixture.tgz
          else
            candidate=out/candidate/Routilet.app
            mkdir -p "$candidate/Contents/MacOS"
            cp Info.plist "$candidate/Contents/Info.plist"
            mkdir -p "$candidate/Contents/Resources"
            cp out/icons/Routilet.icns "$candidate/Contents/Resources/"
            CGO_ENABLED=1 MACOSX_DEPLOYMENT_TARGET=12.0 go build -mod=readonly -tags production -trimpath -ldflags="-X main.buildVersion=9999.0.0 -X main.fixtureMode=ready" -o "$candidate/Contents/MacOS/Routilet" .
            codesign --force --sign - "$candidate"
            python3 scripts/package-manager.py --version 9999.0.0 --macos "$candidate" --out out/manager-fixture.tgz
            python3 scripts/check-distribution.py "out/发行 验证/deep-folder/another folder/用户文件/Routilet.app/Contents/MacOS/Routilet" "$VERSION" out/manager-fixture.tgz
          fi
      - name: Stage native manager for release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p out/manager-native
          if [[ "$TARGET" == win32-x64 ]]; then
            cp out/package/Routilet/Routilet.exe out/manager-native/Routilet.exe
            cp out/package/Routilet/runtime/licenses/THIRD_PARTY_NOTICES.txt out/manager-native/NOTICES.txt
          else
            cp -R out/package/Routilet.app out/manager-native/Routilet.app
            rm out/manager-native/Routilet.app/Contents/MacOS/pnpm
            cp out/package/Routilet.app/Contents/Resources/licenses/THIRD_PARTY_NOTICES.txt out/manager-native/NOTICES.txt
            rm -f out/manager-native/Routilet.app/Contents/Resources/licenses/pnpm-*
            codesign --force --sign - out/manager-native/Routilet.app
            codesign --verify --strict out/manager-native/Routilet.app
          fi
          tar -czf "out/manager-native-$TARGET.tar.gz" -C out/manager-native .
      - uses: actions/upload-artifact@v4
        with:
          name: routilet-native-${{ matrix.target }}
          path: |
            desktop/out/routilet-native-*.zip
            desktop/go.mod
            desktop/go.sum
            desktop/out/manager-native-*.tar.gz
          if-no-files-found: error
  package-manager:
    needs: [plan, build, frontend-interaction]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: routilet-native-*
          path: native-artifacts
      - name: Assemble both native manager platforms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/windows out/macos
          tar -xzf "$(find native-artifacts -name manager-native-win32-x64.tar.gz -print -quit)" -C out/windows
          tar -xzf "$(find native-artifacts -name manager-native-darwin-arm64.tar.gz -print -quit)" -C out/macos
          mkdir -p release
          python3 desktop/scripts/package-manager.py --version "$VERSION" --windows out/windows/Routilet.exe --macos out/macos/Routilet.app --out "release/routilet-$VERSION.tgz"
          cp "$(find native-artifacts -name routilet-native-win32-x64.zip -print -quit)" "release/routilet-$VERSION-win32-x64.zip"
          cp "$(find native-artifacts -name routilet-native-darwin-arm64.zip -print -quit)" "release/routilet-$VERSION-darwin-arm64.zip"
          (cd release; sha256sum *.tgz *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: routilet-release-${{ env.VERSION }}
          path: release/
          if-no-files-found: error
  publish:
    needs: [plan, package-manager]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.existing == 'true' || needs.package-manager.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global 'npm@^11.21.0'
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.existing == 'false'
        with:
          name: routilet-release-${{ env.VERSION }}
          path: release
      - name: Reuse immutable published release assets
        if: needs.plan.outputs.existing == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir release --pattern "routilet-$VERSION.tgz" --pattern "routilet-$VERSION-*.zip" --pattern "routilet-$VERSION-*.tar.gz" --pattern SHA256SUMS
      - name: Publish exact verified package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          (cd release; sha256sum -c SHA256SUMS)
          # Refuse to overwrite a version or treat network failure as absence.
          node --input-type=module - "$VERSION" "release/routilet-$VERSION.tgz" <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const [v,file]=process.argv.slice(2);
          const r=await fetch('https://registry.npmjs.org/@routilet%2Froutilet/'+encodeURIComponent(v));
          if(r.status===404){fs.writeFileSync('publish-needed','yes');}
          else if(r.ok){
            const j=await r.json();
            const integrity='sha512-'+createHash('sha512').update(fs.readFileSync(file)).digest('base64');
            if(j.dist?.integrity!==integrity)throw Error('Version already exists with different integrity; do not overwrite');
            console.log('Already published, identical integrity');
          }else throw Error('Registry status '+r.status);
          NODE
          if [[ -f publish-needed ]]; then npm publish "./release/routilet-$VERSION.tgz" --access public --tag "$TAG"; fi
          echo "Verified publication: @routilet/routilet@$VERSION ($TAG)" >> "$GITHUB_STEP_SUMMARY"
  github-release:
    needs: [plan, package-manager]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.existing == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: routilet-release-${{ env.VERSION }}
          path: release
      - name: Publish native downloads
        shell: bash
        run: |
          set -euo pipefail
          (cd release; sha256sum -c SHA256SUMS)
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
            echo "Release already exists; no overwrite"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          args=()
          if [[ "$TAG" == next ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$tag" release/*.zip release/*.tgz release/SHA256SUMS --verify-tag --title "Routilet $VERSION" --notes-file docs/release-notes.md "${args[@]}"
