name: Resolve native Go lock
on:
  push:
    branches: [maintenance/v0.1.1]
    paths: ['.github/workflows/resolve-go-lock.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Resolve lock and emit exact file contents
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/launcher-gui
          go mod tidy
          echo 'GO_MOD_BEGIN'
          cat go.mod
          echo 'GO_MOD_END'
          echo 'GO_SUM_BEGIN'
          cat go.sum
          echo 'GO_SUM_END'
