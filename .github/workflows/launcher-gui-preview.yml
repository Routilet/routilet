name: Routilet launcher GUI preview
on:
  push:
    branches: [experiment/launcher-gui]
    paths:
      - 'experiments/launcher-gui/**'
      - '.github/workflows/launcher-gui-preview.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
            archive: pnpm-win32-x64.zip
            digest: 0a9c1bc147202089b12d91f43349f6f9ae26df191ee704dee313ba3f9a0a8ffe
          - runner: macos-15
            target: darwin-arm64
            archive: pnpm-darwin-arm64.tar.gz
            digest: af43c44f22ef89191d83163c3ef9f5ee021a7368f401c95d92731be7d6b21cc5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/launcher-gui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Resolve dependencies and test
        shell: bash
        run: |
          go mod tidy
          go test ./...
          go vet ./...
      - name: Build desktop preview with fixed pnpm
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          SHA256: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p out/extracted out/package
          curl --fail --location --retry 3 "https://github.com/pnpm/pnpm/releases/download/v12.22.0/$ARCHIVE" -o "out/$ARCHIVE"
          if [[ "$TARGET" == win32-x64 ]]; then
            printf '%s  %s\n' "$SHA256" "out/$ARCHIVE" | sha256sum -c -
            unzip -q "out/$ARCHIVE" -d out/extracted
            bin="$(find out/extracted -type f -iname 'pnpm*.exe' | head -n1)"
            test -n "$bin"
            cp "$bin" out/package/pnpm.exe
            CGO_ENABLED=0 go build -tags production -trimpath -ldflags="-s -w -H windowsgui" -o out/package/Routilet.exe .
            # Console self-test build exercises identical backend.
            CGO_ENABLED=0 go build -tags production -trimpath -o out/package/console-test.exe .
            out/package/console-test.exe --self-test
            rm out/package/console-test.exe
          else
            test "$(uname -m)" = arm64
            printf '%s  %s\n' "$SHA256" "out/$ARCHIVE" | shasum -a 256 -c -
            tar -xzf "out/$ARCHIVE" -C out/extracted
            bin="$(find out/extracted -type f \( -name pnpm -o -name pnpm-darwin-arm64 \) | head -n1)"
            test -n "$bin"
            app=out/package/Routilet.app
            mkdir -p "$app/Contents/MacOS"
            cp "$bin" "$app/Contents/MacOS/pnpm"
            chmod +x "$app/Contents/MacOS/pnpm"
            cp Info.plist "$app/Contents/Info.plist"
            CGO_ENABLED=1 MACOSX_DEPLOYMENT_TARGET=12.0 go build -tags production -trimpath -ldflags="-s -w" -o "$app/Contents/MacOS/Routilet" .
            codesign --force --sign - "$app"
            codesign --verify --strict "$app"
            "$app/Contents/MacOS/Routilet" --self-test
          fi
          cp README.md out/package/
          cp ../../LICENSE out/package/Routilet-LICENSE
          while IFS= read -r -d '' notice; do
            cp "$notice" "out/package/pnpm-$(basename "$notice")"
          done < <(find out/extracted -type f \( -iname '*license*' -o -iname '*notice*' \) -print0)
          if ! compgen -G "out/package/pnpm-*LICENSE*" >/dev/null && ! compgen -G "out/package/pnpm-*license*" >/dev/null; then
            curl --fail --location --retry 3 https://raw.githubusercontent.com/pnpm/pnpm/v12.22.0/LICENSE -o out/package/pnpm-LICENSE
          fi
          if [[ "$TARGET" == win32-x64 ]]; then
            (cd out/package && powershell.exe -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../routilet-gui-win32-x64.zip")
          else
            tar -czf out/routilet-gui-darwin-arm64.tar.gz -C out/package .
          fi
          ls -lh out/routilet-gui-*
      - name: Test native manager self-update from local npm tarball
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == win32-x64 ]]; then
            CGO_ENABLED=0 go build -tags production -trimpath -ldflags="-H windowsgui -X main.buildVersion=0.1.1" -o out/candidate.exe .
            python scripts/package-manager.py --version 0.1.1 --windows out/candidate.exe --out out/manager-fixture.tgz
            CGO_ENABLED=0 go build -tags production -o out/package/self-update-test.exe .
            out/package/self-update-test.exe --self-update-test out/manager-fixture.tgz 0.1.1
          else
            candidate=out/candidate/Routilet.app
            mkdir -p "$candidate/Contents/MacOS"
            cp Info.plist "$candidate/Contents/Info.plist"
            CGO_ENABLED=1 MACOSX_DEPLOYMENT_TARGET=12.0 go build -tags production -trimpath -ldflags="-X main.buildVersion=0.1.1" -o "$candidate/Contents/MacOS/Routilet" .
            codesign --force --sign - "$candidate"
            python3 scripts/package-manager.py --version 0.1.1 --macos "$candidate" --out out/manager-fixture.tgz
            out/package/Routilet.app/Contents/MacOS/Routilet --self-update-test out/manager-fixture.tgz 0.1.1
          fi
      - name: Stage native manager for release dry run
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p out/manager-native
          if [[ "$TARGET" == win32-x64 ]]; then
            cp out/package/Routilet.exe out/manager-native/Routilet.exe
          else
            cp -R out/package/Routilet.app out/manager-native/Routilet.app
            rm out/manager-native/Routilet.app/Contents/MacOS/pnpm
            codesign --force --sign - out/manager-native/Routilet.app
            codesign --verify --strict out/manager-native/Routilet.app
          fi
          tar -czf "out/manager-native-$TARGET.tar.gz" -C out/manager-native .
      - uses: actions/upload-artifact@v4
        with:
          name: routilet-gui-${{ matrix.target }}
          path: |
            experiments/launcher-gui/out/routilet-gui-*.zip
            experiments/launcher-gui/out/routilet-gui-*.tar.gz
            experiments/launcher-gui/go.mod
            experiments/launcher-gui/go.sum
            experiments/launcher-gui/out/manager-native-*.tar.gz
          if-no-files-found: error
  package-manager:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: routilet-gui-*
          path: native-artifacts
      - name: Assemble both native manager platforms (no publication)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/windows out/macos
          tar -xzf "$(find native-artifacts -name manager-native-win32-x64.tar.gz -print -quit)" -C out/windows
          tar -xzf "$(find native-artifacts -name manager-native-darwin-arm64.tar.gz -print -quit)" -C out/macos
          python3 experiments/launcher-gui/scripts/package-manager.py --version 0.1.0 --windows out/windows/Routilet.exe --macos out/macos/Routilet.app --out out/routilet-0.1.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: routilet-manager-npm-dry-run
          path: out/routilet-0.1.0.tgz
          if-no-files-found: error
